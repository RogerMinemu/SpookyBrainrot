<!doctype html>
<html lang="es" data-room="prologue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
  <title>SpookyBrainrot</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/play.css">
</head>
<body class="play">
  <div id="art" aria-hidden="true"></div>
  <main>
    <section id="join" class="hidden">
      <h1 class="title"><span class="title-text">Únete a la partida</span></h1>
      <form id="join-form" class="panel join-panel">
        <input id="code" maxlength="4" placeholder="Código" autocapitalize="characters" autocomplete="off" required>
        <input id="name" maxlength="24" placeholder="Tu nombre" autocomplete="nickname" required>
        <button type="submit" class="btn">Entrar</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="game" class="hidden"></section>
    <div id="conn" class="conn hidden">Reconectando...</div>
  </main>
  <script type="module" src="/static/js/play/main.js"></script>
</body>
</html>
